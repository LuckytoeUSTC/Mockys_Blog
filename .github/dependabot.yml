version: 2

# Routine dependency upgrade PRs are intentionally disabled. Dependency changes
# must be reviewed and tested individually against Quartz before they are accepted.
# Dependabot alerts and security updates remain controlled by the repository's
# GitHub security settings.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
