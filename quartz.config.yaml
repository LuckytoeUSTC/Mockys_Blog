# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# Mockys' Nest 的站点级配置。上游默认值保留在 quartz.config.default.yaml。
configuration:
  pageTitle: Mockys' Nest
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: zh-CN
  baseUrl: mockys.net
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    # 使用本机字体栈，避免国内访问时依赖 Google Fonts。
    fontOrigin: local
    cdnCaching: false
    typography:
      header: system-ui
      body: system-ui
      code: ui-monospace
    colors:
      lightMode:
        light: "#f7f4ec"
        lightgray: "#e9e3d6"
        gray: "#9b9385"
        darkgray: "#3f4343"
        dark: "#20292b"
        secondary: "#315f6f"
        tertiary: "#866744"
        highlight: rgba(49, 95, 111, 0.12)
        textHighlight: "#e4c96f80"
      darkMode:
        light: "#111517"
        lightgray: "#23292c"
        gray: "#6f7c81"
        darkgray: "#ccd4d6"
        dark: "#f3f1ea"
        secondary: "#8db6c4"
        tertiary: "#d0a878"
        highlight: rgba(141, 182, 196, 0.13)
        textHighlight: "#a98c3f73"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      folderDefaultState: collapsed
      folderClickBehavior: link
      useSavedState: true
    layout:
      position: left
      priority: 20
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        depth: -1
    layout:
      position: afterBody
      priority: 10
      condition: index-only
      group: home-bottom
      groupOptions:
        align: stretch
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: right
      priority: 5
      group: page-tools
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      group: article-heading
      groupOptions:
        grow: true
        align: end
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: has-tags
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: right
      priority: 10
      group: page-tools
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@mockys/language-switcher"
    enabled: true
    layout:
      position: beforeBody
      priority: 15
  - source: "@mockys/reader-preferences"
    enabled: true
    layout:
      position: right
      priority: 20
      group: page-tools
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/LuckytoeUSTC/Mockys_Blog
        RSS: https://mockys.net/index.xml
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: 最近更新
      limit: 2
      showTags: true
      hideTagPages: true
      hideFolderPages: false
    layout:
      position: afterBody
      priority: 5
      condition: index-only
      group: home-bottom
      groupOptions:
        align: stretch
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - author
        - language
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    article-heading:
      priority: 10
      direction: row
      wrap: nowrap
      gap: 0.65rem
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
    home-bottom:
      priority: 5
      direction: column
      gap: 2rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
